name: Data refresh

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: full = recrawl, discovery, verification, reputation; quick = cached recrawl and verification
        type: choice
        options: [full, quick]
        default: full
      budget:
        description: Maximum Anthropic spend for this run, USD
        default: "250"

permissions:
  contents: write
  actions: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODE: ${{ inputs.mode || 'full' }}
      BUDGET: ${{ inputs.budget || '250' }}
      HISTORY_ORIGIN: refresh
    steps:
      - name: Check configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install tools
        run: |
          pip install shapely pytest
          npm install -g @anthropic-ai/claude-code@2.1.331
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GIT_STATE=$({ cat .git/config; find .git/hooks -type f -exec sha256sum {} + | sort; } | sha256sum | cut -c1-64)" >> "$GITHUB_ENV"

      - name: Refresh with Claude
        timeout-minutes: 280
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          sed -e "s/{{MODE}}/$MODE/" -e "s/{{BASE}}/$BASE/g" .github/refresh/prompt.md > "$RUNNER_TEMP/prompt.md"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model claude-opus-5-5 \
            --max-budget-usd "$BUDGET" \
            --max-turns 2000 \
            --mcp-config .github/refresh/mcp.json --strict-mcp-config \
            --dangerously-skip-permissions \
            --output-format stream-json --verbose \
            | tee "$RUNNER_TEMP/claude.jsonl" | jq -rc 'select(.type == "result") // empty'

      # This repository is public: nothing Claude wrote may carry the key into a commit.
      - name: Reject a leaked key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if grep -rqF --exclude-dir=.git -- "$ANTHROPIC_API_KEY" . "$RUNNER_TEMP/claude.jsonl"; then
            echo "::error::The API key appears in the working tree or the transcript; not publishing."
            exit 1
          fi
      - name: Reject changes to the guard rails
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            echo "::error::Claude created commits; the workflow commits itself."
            exit 1
          fi
          touched=$( { git diff --name-only "$BASE"; git ls-files --others --exclude-standard; } \
            | grep -E '^(\.github/|scraper/publish_gate\.py|scraper/tests/test_publish_gate\.py)' || true)
          if [ -n "$touched" ]; then
            echo "::error::Claude changed protected files: $touched"
            exit 1
          fi

      # The gate always runs as committed at BASE, isolated from anything Claude added to the checkout.
      - name: Publish gate
        env:
          GATE_ROOT: ${{ github.workspace }}
        run: |
          git show "$BASE:scraper/publish_gate.py" > "$RUNNER_TEMP/gate.py"
          python3 -I "$RUNNER_TEMP/gate.py" apply --base-ref "$BASE"
          python3 scraper/history.py append
          python3 scraper/export_db.py
          python3 -I "$RUNNER_TEMP/gate.py" check --base-ref "$BASE"
      - name: Tests and build
        run: |
          python3 -m pytest -q scraper/tests
          GOOGLE_MAP_API_KEY=ci-placeholder python3 build.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$({ cat .git/config; find .git/hooks -type f -exec sha256sum {} + | sort; } | sha256sum | cut -c1-64)
          if [ "$state" != "$GIT_STATE" ]; then
            echo "::error::.git/config or .git/hooks changed during the run; not pushing."
            exit 1
          fi
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          python3 -I "$RUNNER_TEMP/gate.py" check --base-ref "$BASE"
          git add web/data db scraper .claude/skills
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "data: scheduled refresh ($MODE) $(date -u +%Y-%m-%d)"; echo
            cat scraper/reports/refresh-summary.md 2>/dev/null || true; } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          gh workflow run pages.yml --ref main

      # The transcript stays on the runner: artifacts of a public repository are downloadable by anyone.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ github.run_id }}
          path: scraper/reports/
          retention-days: 30
